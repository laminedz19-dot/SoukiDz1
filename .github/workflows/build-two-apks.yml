name: Build Souqi DZ APKs

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build user and admin APKs
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 platforms;android-34 build-tools;35.0.0

      - name: Decode debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build both debug APKs
        run: ./gradlew :app:testDebugUnitTest :admin:testDebugUnitTest :app:assembleDebug :admin:assembleDebug --no-daemon

      - name: Prepare Clean APKs
        run: |
          mkdir -p dist-apks
          cp app/build/outputs/apk/debug/app-debug.apk dist-apks/SouqiDz-User.apk
          cp admin/build/outputs/apk/debug/admin-debug.apk dist-apks/SouqiDz-Admin.apk

      - name: Upload All APKs
        uses: actions/upload-artifact@v4
        with:
          name: souqi-dz-apks
          path: dist-apks/*.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: souqi-dz-admin-apk
          path: dist-apks/SouqiDz-Admin.apk

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: souqi-dz-user-apk
          path: dist-apks/SouqiDz-User.apk

      - name: Publish Direct APK Download Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.4
          name: "Souqi DZ APKs v1.0.4 (ترقية شاملة لتطبيق الإدارة والمزامنة السحابية)"
          make_latest: true
          body: |
            ### تحميل مباشر لملفات APK بدون الحاجة لفك الضغط:
            - اضغط مباشرة على ملف **SouqiDz-User.apk** أدناه لتنزيله وتثبيته فوراً.
            - اضغط مباشرة على ملف **SouqiDz-Admin.apk** أدناه لتنزيل تطبيق الإدارة وتثبيته فوراً.
            
            **أبرز التحديثات في v1.0.4 (مراجعة وترقية تطبيق الإدارة):**
            - جلب ومراجعة كافة الإعلانات المعلقة (UNDER_REVIEW) مباشرة من السحابة مع عرض صورة السلعة في لوحة الإشراف.
            - مزامنة فورية للإعدادات الرسمية (رقم BaridiMob RIP وأسعار النشر) من تطبيق الإدارة إلى كافة أجهزة المستخدمين سحابياً.
            - مزامنة المستخدمين والمدفوعات والبلاغات من Firestore مع إمكانية التوثيق أو الحظر الفعلي في السحابة.
            - إضافة زر التحديث السحابي المباشر (Refresh) في شريط لوحة الإدارة لمزامنة كافة الأقسام بضغطة زر واحدة.
          files: |
            dist-apks/SouqiDz-User.apk
            dist-apks/SouqiDz-Admin.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
